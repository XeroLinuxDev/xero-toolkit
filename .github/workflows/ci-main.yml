name: CI — Main

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build verification
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Bootstrap pacman
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies from PKGBUILD
        run: |
          # Packages only available from custom repos / AUR — skip in CI
          _skip="scx-tool"
          _deps=$(
            sed -n "/^\(depends\|makedepends\)=(/,/)/p" packaging/PKGBUILD \
            | grep -oP "'[a-zA-Z0-9][a-zA-Z0-9_.+-]*" \
            | tr -d "'" \
            | sort -u \
            | grep -vxF -e "${_skip}" \
            | tr '\n' ' '
          )
          echo "Installing: ${_deps}"
          pacman -S --noconfirm --needed ${_deps}

      - name: Cache cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: main-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: main-${{ runner.os }}-cargo-

      - name: Build (debug)
        run: cargo build --locked
