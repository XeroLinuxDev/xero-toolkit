name: CI — Develop

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format / Clippy / Build / Test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git
          # Parse depends + makedepends from PKGBUILD
          _deps=$(
            sed -n "/^\(depends\|makedepends\)=(/,/)/p" packaging/PKGBUILD \
            | grep -oP "'\K[^']+" \
            | sort -u \
            | tr '\n' ' '
          )
          echo "Installing: ${_deps}"
          pacman -S --noconfirm --needed ${_deps}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dev-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: dev-${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build --locked

      - name: Run tests
        run: cargo test --workspace
