[[button]]
id = "btn_fingerprint_setup"
title = "Fingerprint Setup"
summary = "Installs xfprintd-gui or launches it if already installed."
details = [
  "Button label/state auto-switches between Install and Launch App.",
  "Installation runs through task runner; launch runs xfprintd-gui directly.",
]

[[button]]
id = "btn_fingerprint_uninstall"
title = "Fingerprint Uninstall"
summary = "Removes xfprintd-gui package."
details = [
  "Visible only when xfprintd-gui is detected as installed.",
  "Runs package removal through the task-runner/AUR-helper path.",
]
